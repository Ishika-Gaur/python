{% extends "base.html" %}

{% block title %}
Contact
{% endblock %}

{% block content %}

<section class="contact">

    <h1>Contact Me</h1>

    <p>
        Have a project in mind or want to connect?
        Feel free to send me a message!
    </p>

    <form action="#" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required
        >

        <textarea
            name="message"
            rows="6"
            placeholder="Your Message"
            required
        ></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

{% endblock %}
